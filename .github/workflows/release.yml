name: "Release"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
          - platform: "macos-13"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # eframe renders through wgpu and opens a window through winit, which
      # on Linux needs X11/Wayland and udev development headers. There is no
      # WebView dependency any more.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libudev-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check
        run: cargo check --workspace --target ${{ matrix.target }}

      # The three credentials tests exercise the real OS keyring, which CI
      # runners do not provide. Everything else must pass.
      - name: Test
        run: cargo test --workspace -- --skip credentials::tests

      - name: Build
        run: cargo build --release -p dbhive-app --target ${{ matrix.target }}

      - name: Package (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: ./packaging/build-macos-app.sh --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbhive-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/dbhive
            target/${{ matrix.target }}/release/dbhive.exe
            target/release/bundle/
          if-no-files-found: ignore
