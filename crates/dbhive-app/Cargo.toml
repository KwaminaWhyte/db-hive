[package]
name = "dbhive-app"
version = "0.21.0"
description = "DB Hive native desktop shell (egui)"
edition = "2021"

[[bin]]
name = "dbhive"
path = "src/main.rs"

[dependencies]
dbhive-core = { path = "../dbhive-core" }

eframe = { version = "0.29", default-features = false, features = [
        "accesskit",     # screen reader support; the React shell had an a11y pass we must not regress
        "default_fonts",
        "wgpu",
        "persistence",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["syntect"] }
egui_plot = "0.29"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
anyhow = "1.0"
