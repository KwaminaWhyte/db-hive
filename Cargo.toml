# Workspace root.
#
# `dbhive-core` holds everything that is not tied to a UI shell. Two shells
# sit on top of it during the migration to a native UI:
#
#   src-tauri      the existing Tauri + React shell (reference implementation)
#   dbhive-app     the native egui shell that replaces it
#
# Both depend on the same core, so behaviour cannot drift between them while
# the migration is in progress. `src-tauri` is deleted once the egui shell
# reaches parity.
[workspace]
resolver = "2"
members = ["crates/dbhive-core", "crates/dbhive-app", "src-tauri"]

# Release profile lives at the workspace root: cargo ignores profiles set on
# non-root workspace members.
#
# opt-level stays at 3 rather than "s": this is a database client, so query
# and result-decoding throughput matters more than a few MB of binary.
# `panic` is deliberately left at "unwind": Tauri's command dispatch relies
# on catch_unwind to turn a panicking command into an IPC error instead of
# taking the whole app down.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
incremental = false
