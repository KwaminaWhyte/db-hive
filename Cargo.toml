# Workspace root.
#
# `dbhive-core` holds everything that is not tied to a UI shell;
# `dbhive-ui-model` is the screens' logic with no UI types; `dbhive-slint`
# is the app itself.
#
# The Tauri + React shell that used to live in `src-tauri` and `src` was
# removed once this reached parity; see docs/rust-ui-migration/.
[workspace]
resolver = "2"
members = [
    "crates/dbhive-core",
    "crates/dbhive-ui-model",
    "crates/dbhive-slint",
]

# Release profile lives at the workspace root: cargo ignores profiles set on
# non-root workspace members.
#
# Dev builds were ~60-100 GB with full debuginfo. Line tables keep backtraces
# readable; split-debuginfo off avoids a .dSYM copy per binary.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"
# Incremental sessions from concurrent builds grew target/debug to ~100 GB with
# nothing pruning them. Full rebuilds are cheaper than that.
incremental = false

[profile.dev.package."*"]
debug = false

# opt-level stays at 3 rather than "s": this is a database client, so query
# and result-decoding throughput matters more than a few MB of binary.
# `panic` is left at "unwind" so a panic in a driver or a plugin call can be
# caught and reported rather than taking the whole app down with it.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
incremental = false
